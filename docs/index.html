<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fantasy League — Record Book</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4;
  --panel: #ffffff;
  --line: #e2e1dd;
  --ink: #1a1a18;
  --muted: #6d6c66;
  --accent: #1f6f4a;
  --win: #1f6f4a;
  --loss: #a33a2c;
  --bar: #d9d8d3;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14140f;
    --panel: #1c1c18;
    --line: #2e2e28;
    --ink: #ece9df;
    --muted: #8f8d83;
    --accent: #6fcf9a;
    --win: #6fcf9a;
    --loss: #e08272;
    --bar: #2e2e28;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 72px; }
header { margin-bottom: 26px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 32px 0 10px; font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 160px; }
tbody tr:last-child td { border-bottom: 0; }
thead th {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); font-weight: 600; cursor: pointer; user-select: none;
  position: sticky; top: 0; background: var(--panel);
}
thead th:hover { color: var(--ink); }
thead th[aria-sort]::after { content: " ↓"; }
thead th[aria-sort="ascending"]::after { content: " ↑"; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pct { font-weight: 600; }
.bar { display: block; height: 3px; margin-top: 4px; background: var(--bar); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); }
.cards > div { background: var(--panel); padding: 12px 14px; }
.cards dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 3px; }
.cards dd { margin: 0; font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.cards dd small { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.w { color: var(--win); }
.l { color: var(--loss); }
.empty { padding: 22px; color: var(--muted); font-size: 14px; }
footer { margin-top: 42px; color: var(--muted); font-size: 12px; line-height: 1.7; }
footer a { color: inherit; }
#profile[hidden] { display: none; }
.pick { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 32px 0 10px; }
.pick h2 { margin: 0; }
select {
  font: inherit; padding: 5px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Fantasy League</h1>
    <p class="sub" id="meta">Loading…</p>
  </header>

  <h2>All-time standings</h2>
  <div class="panel scroll">
    <table id="standings">
      <thead><tr>
        <th data-k="franchise">Franchise</th>
        <th data-k="winPercentage" aria-sort="descending">Win %</th>
        <th data-k="wins">Record</th>
        <th data-k="gamesPlayed">GP</th>
        <th data-k="avgPointsFor">PF/g</th>
        <th data-k="avgPointsAgainst">PA/g</th>
        <th data-k="seasons">Seasons</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="pick">
    <h2>Franchise</h2>
    <select id="picker"></select>
  </div>

  <section id="profile" hidden>
    <div class="panel"><dl class="cards" id="summary"></dl></div>

    <h2>Head to head</h2>
    <div class="panel scroll">
      <table id="h2h">
        <thead><tr>
          <th data-k="opponent">Opponent</th>
          <th data-k="winPercentage" aria-sort="descending">Win %</th>
          <th data-k="wins">Record</th>
          <th data-k="avgPointsFor">PF/g</th>
          <th data-k="avgPointsAgainst">PA/g</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <h2>Season by season</h2>
    <div class="panel scroll">
      <table id="seasons">
        <thead><tr>
          <th data-k="year">Season</th>
          <th data-k="winPercentage">Win %</th>
          <th data-k="wins">Record</th>
          <th data-k="pointsFor">PF</th>
          <th data-k="pointsAgainst">PA</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer id="footnote"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const pct = (n) => n.toFixed(1) + '%';
let DATA, LIST;

// Sorting. Every table here is "click a header, sort by it"; numeric columns
// start descending because the interesting end is always the top.
function sortable(table, rows, render, initial, initialDir = -1) {
  let key = initial, dir = initialDir;
  const heads = [...table.tHead.rows[0].cells];
  const apply = () => {
    const sorted = [...rows].sort((a, b) => {
      const x = a[key], y = b[key];
      const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y));
      return c * dir;
    });
    heads.forEach((h) => h.removeAttribute('aria-sort'));
    heads.find((h) => h.dataset.k === key)
      ?.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    table.tBodies[0].replaceChildren(...sorted.map(render));
  };
  heads.forEach((h) => h.onclick = () => {
    const k = h.dataset.k;
    // Same column toggles direction; a new column starts at its natural end —
    // descending for numbers, ascending for names.
    if (k === key) dir = -dir;
    else { key = k; dir = typeof rows[0][k] === 'number' ? -1 : 1; }
    apply();
  });
  apply();
  return () => apply();
}

const cell = (html, cls) => {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  td.innerHTML = html;
  return td;
};

const winBar = (n) => `<span class="pct">${pct(n)}</span><span class="bar"><i style="width:${n}%"></i></span>`;

function standingsRow(a) {
  const tr = document.createElement('tr');
  tr.append(
    cell(a.franchise),
    cell(winBar(a.winPercentage)),
    cell(a.record),
    cell(a.gamesPlayed),
    cell(a.avgPointsFor.toFixed(1)),
    cell(a.avgPointsAgainst.toFixed(1)),
    cell(`${a.firstSeason}–${a.lastSeason}`),
  );
  tr.onclick = () => select(a.franchise);
  tr.dataset.franchise = a.franchise;
  return tr;
}

function select(name) {
  const t = DATA.franchises[name];
  if (!t) return;
  $('#picker').value = name;
  location.hash = encodeURIComponent(name);
  for (const tr of $('#standings').tBodies[0].rows) {
    tr.setAttribute('aria-selected', tr.dataset.franchise === name);
  }

  const a = t.allTime;
  const stat = (label, value, note = '') =>
    `<div><dt>${label}</dt><dd>${value}${note ? ` <small>${note}</small>` : ''}</dd></div>`;
  $('#summary').innerHTML = [
    stat('All-time', a.record),
    stat('Win %', pct(a.winPercentage)),
    stat('Points for', a.pointsFor.toLocaleString(), `${a.avgPointsFor.toFixed(1)}/g`),
    stat('Points against', a.pointsAgainst.toLocaleString(), `${a.avgPointsAgainst.toFixed(1)}/g`),
    stat('Seasons', a.seasons, `${a.firstSeason}–${a.lastSeason}`),
    stat('Best week', a.bestWeek.points, `${a.bestWeek.year} wk${a.bestWeek.round}`),
    stat('Worst week', a.worstWeek.points, `${a.worstWeek.year} wk${a.worstWeek.round}`),
  ].join('');

  sortable($('#h2h'), t.opponentHistory, (o) => {
    const tr = document.createElement('tr');
    tr.append(
      cell(o.opponent),
      cell(winBar(o.winPercentage)),
      cell(o.record),
      cell(o.avgPointsFor.toFixed(1)),
      cell(o.avgPointsAgainst.toFixed(1)),
    );
    tr.onclick = () => select(o.opponent);
    return tr;
  }, 'winPercentage');

  sortable($('#seasons'), t.seasons.map((s) => ({ ...s, year: +s.year })), (s) => {
    const tr = document.createElement('tr');
    tr.append(
      cell(s.year),
      cell(winBar(s.winPercentage)),
      cell(s.record, s.winPercentage >= 50 ? 'w' : 'l'),
      cell(s.pointsFor.toFixed(1)),
      cell(s.pointsAgainst.toFixed(1)),
    );
    return tr;
  }, 'year', 1);

  $('#profile').hidden = false;
}

async function init() {
  const res = await fetch('data/league_records.json');
  DATA = await res.json();
  LIST = Object.values(DATA.franchises).map((t) => ({ ...t.allTime, franchise: t.franchise }));

  const m = DATA.meta;
  $('#meta').textContent =
    `${m.games.toLocaleString()} games · ${LIST.length} franchises · ${m.seasons[0]}–${m.seasons.at(-1)}`;
  $('#footnote').innerHTML =
    `${m.source}. ${m.note}<br>Rebuilt by <code>build.py</code> from <code>data/league_h2h.csv</code>.`;

  sortable($('#standings'), LIST, standingsRow, 'winPercentage');

  $('#picker').replaceChildren(
    new Option('Pick a franchise…', ''),
    ...LIST.map((t) => t.franchise).sort().map((n) => new Option(n, n)),
  );
  $('#picker').onchange = (e) => e.target.value && select(e.target.value);

  const initial = decodeURIComponent(location.hash.slice(1));
  if (DATA.franchises[initial]) select(initial);
}

init().catch((err) => {
  $('#meta').textContent = 'Could not load the record book.';
  console.error(err);
});
</script>
</body>
</html>
